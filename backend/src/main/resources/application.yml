spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/english_learning
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  security:
    user:
      name: admin
      password: admin

server:
  port: 8080

app:
  jwt:
    secret: mySecretKeyForEnglishLearningPortal1234567890
    expiration: 86400000
